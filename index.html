<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElderCare 360 — Healthcare Web Patient Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <div class="portal-window">
    <aside class="sidebar">
      <div>
        <div class="brand-row">
          <div class="brand-left">
            <div class="brand-logo">🩺</div>
            <span class="brand-name">ElderCare</span>
          </div>
          <span class="collapse-icon">«</span>
        </div>

        <ul class="nav-menu">
          <li>
            <button class="nav-item active" data-tab="dashboard" onclick="PortalApp.switchTab('dashboard')">
              <span class="nav-icon">⊞</span> Dashboard
            </button>
          </li>
          <li>
            <button class="nav-item" data-tab="medicines" onclick="PortalApp.switchTab('medicines')">
              <span class="nav-icon">💊</span> Prescriptions
            </button>
          </li>
          <li>
            <button class="nav-item" data-tab="health" onclick="PortalApp.switchTab('health')">
              <span class="nav-icon">📊</span> Statistics & Steps
            </button>
          </li>
          <li>
            <button class="nav-item" data-tab="hardware" onclick="PortalApp.switchTab('hardware')">
              <span class="nav-icon">📡</span> Fall Sensor IoT
            </button>
          </li>
          <li>
            <button class="nav-item" data-tab="caregiver" onclick="PortalApp.switchTab('caregiver')">
              <span class="nav-icon">💬</span> Caregiver & SOS
              <span class="nav-count">3</span>
            </button>
          </li>
        </ul>
      </div>

      <div class="sidebar-bottom">
        <button class="nav-item" onclick="FallSimulator.triggerFall()">
          <span class="nav-icon">⚡</span> Simulate Fall
        </button>
        <button class="nav-item" onclick="FallSimulator.sendSOS('Manual SOS Button Pressed')">
          <span class="nav-icon">🚨</span> Emergency SOS
        </button>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="search-box">
          <span>🔍</span>
          <input type="text" placeholder="Search vitals, medicines, schedule or sensor status..." />
        </div>

        <div class="topbar-right">
          <button class="icon-circle-btn" onclick="FallSimulator.triggerFall()" title="Simulate Fall Detection">
            🔔
            <span class="notif-dot"></span>
          </button>

          <div class="profile-pill" onclick="PortalApp.switchTab('caregiver')">
            <div class="profile-avatar">RK</div>
            <div class="profile-info">
              <div class="profile-name">Ramesh Kulkarni</div>
              <div class="profile-role">Patient • 72 y.o. (O+)</div>
            </div>
            <span style="font-size: 12px; color: var(--text-muted); margin-left: 4px;">⌄</span>
          </div>
        </div>
      </header>

      <div class="portal-body">
        <main class="center-col" id="center-mount"></main>

        <aside class="schedule-panel">
          <div class="section-head" style="margin-bottom: 4px;">
            <div class="section-title">Schedule</div>
            <div class="pill-tabs">
              <button class="pill-tab active">Today</button>
              <button class="pill-tab">This week</button>
            </div>
          </div>

          <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--text-secondary);">
            <strong style="color: var(--charcoal);">Today, 11 Nov, Wed</strong>
            <span class="btn-pill btn-white" style="padding: 4px 10px; font-size: 11.5px;">Upcoming ⌄</span>
          </div>

          <div class="timeline-wrap" id="schedule-mount"></div>
        </aside>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="fall-modal">
    <div class="fall-modal">
      <span class="stat-badge warn" style="margin-bottom: 10px;">⚠️ MPU6050 IMPACT DETECTED (3.84g)</span>
      <h2 style="font-size: 24px; margin-bottom: 6px;">Fall Detected — Are You Okay?</h2>
      <p style="font-size: 14px; color: var(--text-secondary);">
        Waistband sensor detected a sudden fall. Caregivers will be alerted automatically in:
      </p>

      <div class="timer-ring" id="fall-timer">15</div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn-pill btn-dark" style="justify-content: center; padding: 13px; font-size: 14px;" onclick="FallSimulator.cancelFall()">
          ✓ I Am Okay (Cancel False Alarm)
        </button>
        <button class="btn-pill btn-danger" style="justify-content: center; padding: 13px; font-size: 14px;" onclick="FallSimulator.sendSOS('Immediate Help Requested After Fall')">
          🚨 Send Emergency SOS Right Now
        </button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/sensorSimulator.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
